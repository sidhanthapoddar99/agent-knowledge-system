[package]
name = "agent-ks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native toolkit for agent-knowledge-system projects"
repository = "https://github.com/sidhanthapoddar99/agent-knowledge-system"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
pathdiff = "0.2"
json5 = "0.4"
chrono = "0.4"

ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
fs2 = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
