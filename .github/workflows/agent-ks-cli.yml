name: Agent KS CLI CI
on:
  push:
    branches: ['main']
    paths: ['agent-ks-cli/**', 'plugins/agent-ks/skills/agent-ks-cli/templates/**', 'agent-ks-engine/src/styles/**', '.github/workflows/agent-ks-cli.yml']
  pull_request:
    paths: ['agent-ks-cli/**', 'plugins/agent-ks/skills/agent-ks-cli/templates/**', 'agent-ks-engine/src/styles/**', '.github/workflows/agent-ks-cli.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: agent-ks-cli
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add '${{ matrix.target }}'
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check, test, and build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release --target '${{ matrix.target }}'
      - name: Test installer
        if: runner.os == 'Linux'
        run: python3 tests/install.py
