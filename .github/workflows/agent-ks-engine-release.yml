name: Agent KS Engine Tag

on:
  push:
    tags:
      - 'agent-ks-engine-v*'

permissions:
  contents: read

concurrency:
  group: agent-ks-engine-release
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/agent-ks-engine-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag, engine version, note, and source identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'agent-ks-engine-v(\d+\.\d+\.\d+)', tag)
          assert match, 'Stable engine tag agent-ks-engine-vX.Y.Z required'
          version = match.group(1)

          source = pathlib.Path('agent-ks-engine/src/loaders/engine-version.ts').read_text()
          declared = re.search(r"export const ENGINE_VERSION = '([^']+)'", source)
          assert declared and declared.group(1) == version, 'Tag must match ENGINE_VERSION'

          note = pathlib.Path('agent-ks-engine/release-notes') / f'{version}.md'
          assert note.is_file(), f'Release note required at {note}'
          lines = note.read_text().splitlines()
          assert lines and re.fullmatch(rf'# {re.escape(version)} — .+', lines[0]), \
              'Release note line 1 must be # <version> — <one line>'
          assert '\n'.join(lines[1:]).lstrip(), 'Release note needs a body below its H1'

          commit = subprocess.check_output(
              ['git', 'rev-parse', f'{tag}^{{commit}}'], text=True
          ).strip()
          assert re.fullmatch(r'[0-9a-f]{40}', commit), 'Commit must be a full Git object ID'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == head, 'Checked-out commit must be the tagged commit'
          tree = subprocess.check_output(
              ['git', 'rev-parse', f'{commit}:agent-ks-engine'], text=True
          ).strip()
          assert re.fullmatch(r'[0-9a-f]{40}', tree), 'Engine tree must be a full Git object ID'

          print(f'Validated Engine {version}: tag={tag} commit={commit} tree={tree}')
          PY
