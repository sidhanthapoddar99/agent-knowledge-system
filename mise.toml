# Puts `bin/` on PATH inside this repo, which is what makes `agent-ks-dev`
# available as a bare command from any subdirectory — and available NOWHERE
# else, so it cannot be typed by accident in a consumer project. A stale
# invocation outside this repo fails with "command not found" rather than
# quietly checking something you did not mean.
#
# Anyone without mise still has ./bin/agent-ks-dev. mise buys the bare name,
# not the capability.
[env]
_.path = ["bin"]
