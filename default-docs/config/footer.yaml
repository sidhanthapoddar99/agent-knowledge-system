# Footer Configuration
#
# Prefer `page:` over `href:` for anything inside this site. `page:` names an
# entry in site.yaml's `pages:` block and resolves to whatever `base_url` that
# entry currently declares — so renaming a section's URL updates the footer for
# free. A hardcoded `href` is a second copy of the same fact, and it is how this
# file ended up shipping four dead links on all 1039 pages.
layout: "@footer/default"

copyright: "© {year} Agent Knowledge System"

columns:
  - title: "Documentation"
    links:
      - label: "User Guide"
        page: "user-guide"
      - label: "Dev Docs"
        page: "dev-docs"
      - label: "Issue Tracker"
        page: "todo"

  - title: "Project"
    links:
      - label: "About"
        page: "about"
      - label: "Blog"
        page: "blog"
      - label: "GitHub"
        href: "https://github.com/sidhanthapoddar99/agent-knowledge-system"

social:
  - platform: "github"
    href: "https://github.com/sidhanthapoddar99/agent-knowledge-system"
