# The installed `agent-ks` remains on PATH. Mise names the local build
# `agent-ks-dev`, so maintainers can compare released and working-tree behavior.
[env]
_.path = ["scripts/bin"]
AGENTKS_CONFIG_FOLDER = "{{config_root}}/default-docs/config"

[shell_alias]
agent-ks-dev = "'{{config_root}}/agent-ks-cli/releases/release/agent-ks'"

[tasks.agent-ks-dev]
description = "Run the locally built agent-ks CLI"
run = "{{config_root}}/agent-ks-cli/releases/release/agent-ks"
raw = true
quiet = true

[tasks.cli-build]
description = "Build the local agent-ks release binary"
dir = "{{config_root}}/agent-ks-cli"
run = "cargo build --release --locked"

[tasks.cli-test]
description = "Test the native toolkit"
dir = "{{config_root}}/agent-ks-cli"
run = "cargo test --locked"

[tasks.release-check]
description = "Validate release workflow and version contracts without publishing"
run = "bun scripts/checks/check-release-contracts.mjs"
